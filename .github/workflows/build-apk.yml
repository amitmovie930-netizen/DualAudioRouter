name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project (if zip is present)
        run: |
          set -e
          echo "=== Repo contents ==="
          ls -la
          ZIP=$(ls DualAudio*.zip DuelAudio*.zip 2>/dev/null | head -1 || true)
          if [ -z "$ZIP" ]; then
            ZIP=$(ls *.zip 2>/dev/null | head -1 || true)
          fi
          if [ -n "$ZIP" ]; then
            echo "Extracting $ZIP ..."
            unzip -o "$ZIP"
            if [ -d DualAudioRouter ]; then
              cp -a DualAudioRouter/. .
              rm -rf DualAudioRouter
            fi
            if [ -d DualAudioRouter_clean ]; then
              cp -a DualAudioRouter_clean/. .
              rm -rf DualAudioRouter_clean
            fi
            rm -f "$ZIP"
            echo "=== After extract ==="
            ls -la
          else
            echo "No zip found – assuming project is already at root"
          fi
          test -f settings.gradle.kts || { echo "ERROR: settings.gradle.kts missing"; exit 1; }
          test -d app || { echo "ERROR: app/ missing"; exit 1; }
          test -f app/build.gradle.kts || { echo "ERROR: app/build.gradle.kts missing"; exit 1; }

      - name: Fix compileSdk (raise to 34)
        run: |
          set -e
          # Raise compileSdk so Compose libraries are happy
          sed -i 's/compileSdk = 31/compileSdk = 34/' app/build.gradle.kts
          # Also install platform 34
          echo "Updated app/build.gradle.kts:"
          grep compileSdk app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK path
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          if [ -d /usr/local/lib/android/sdk/cmdline-tools/latest/bin ]; then
            echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          elif [ -d /usr/local/lib/android/sdk/cmdline-tools/bin ]; then
            echo "/usr/local/lib/android/sdk/cmdline-tools/bin" >> $GITHUB_PATH
          else
            CT=$(find /usr/local/lib/android/sdk/cmdline-tools -type d -name bin 2>/dev/null | head -1)
            if [ -n "$CT" ]; then
              echo "$CT" >> $GITHUB_PATH
            fi
          fi
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH

      - name: Install required Android SDK packages
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          which sdkmanager || echo "sdkmanager still not found"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "platforms;android-31" "build-tools;34.0.0" "platform-tools"

      - name: Install Gradle 8.2
        run: |
          set -e
          curl -fsSL https://services.gradle.org/distributions/gradle-8.2-bin.zip -o /tmp/gradle-8.2-bin.zip
          unzip -q /tmp/gradle-8.2-bin.zip -d /opt
          echo "/opt/gradle-8.2/bin" >> $GITHUB_PATH
          /opt/gradle-8.2/bin/gradle --version

      - name: Build Debug APK
        run: |
          set -e
          gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log
          echo "=== Looking for APK ==="
          find app/build/outputs -name "*.apk" -ls || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DualAudioRouter-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
